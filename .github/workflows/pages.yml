name: Publish demo (GitHub Pages)
# Builds the web export on every push to main and publishes it at
# https://<owner>.github.io/<repo>/ so a tester can open it on a phone or laptop with nothing to
# install. With the repository variables EXPO_PUBLIC_SUPABASE_URL and
# EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY set (Settings → Secrets and variables → Actions →
# Variables) it is the real app with sign-in; without them, the sample project where nothing is
# saved. The publishable key is meant to be public: row-level security guards the data.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
        env:
          # Project sites live under /<repo-name>/; asset paths must match.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Pages runs Jekyll by default, which drops folders starting with "_" — such as _expo.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
